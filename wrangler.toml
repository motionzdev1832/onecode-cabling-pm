name = "onecode-cabling-pm"
main = "server/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Built React app. Unknown paths fall back to index.html (client-side routing);
# /api/* always goes to the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "onecode-cabling-pm"
database_id = "edcc1c1e-6dde-4868-a0c1-2b5f148fc041"
migrations_dir = "drizzle"

[observability]
enabled = true
